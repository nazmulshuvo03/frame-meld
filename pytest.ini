[pytest]
# services/backend/pyproject.toml already carries asyncio_mode = "auto" for
# anyone running pytest from services/backend, but pytest's ini-file
# discovery only walks upward from the invocation directory, so that file is
# invisible when pytest is invoked bare from the repo root (no ini file
# existed here at all). Without this, every async fixture/test collected
# from the repo root falls back to pytest-asyncio's default strict mode and
# errors out. This file is intentionally minimal — it exists solely to make
# `pytest` work when run from the repo root; services/backend keeps using
# its own pyproject.toml (found first, closer to cwd) for everything else.
asyncio_mode = auto
testpaths = services/backend/tests
