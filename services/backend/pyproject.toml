[project]
name = "framemeld"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pydantic[email]>=2.9",
    "argon2-cffi>=23.1",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24,<2",
    "httpx>=0.28",
    "ruff>=0.8,<0.17",
    "fakeredis>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/framemeld"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Explicit, so "lint is clean" is a claim about a fixed rule set rather than
# about whichever rules the installed ruff version happens to default to.
# E501 in particular is NOT in ruff's default selection, so line-length was
# configured and unenforced before this.
select = ["E4", "E7", "E9", "E501", "F", "I", "UP", "B", "DTZ", "RUF"]
